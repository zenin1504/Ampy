name: Build Ampy

on:
  # Manual-only workflow: no push, tag-push, or pull_request triggers.
  # Automatic builds are disabled in this repository.
  # Run the workflow manually from the Actions tab. To publish a signed
  # GitHub Release, dispatch it on a v* tag ref.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING: ${{ secrets.KEYSTORE_BASE64 != '' }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Install Android SDK platform 37, Build Tools 37 and NDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.2.12479018"
          # API 37 ships as android-37.0; AGP looks for android-37.
          rm -rf "$ANDROID_HOME/platforms/android-37"
          cp -a "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          sed -i 's/^AndroidVersion.ApiLevel=37\.0$/AndroidVersion.ApiLevel=37/' "$ANDROID_HOME/platforms/android-37/source.properties"
          sed -i 's/platforms;android-37\.0/platforms;android-37/g' "$ANDROID_HOME/platforms/android-37/package.xml"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode release keystore
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/ampy-release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/signing/ampy-release.jks" >> "$GITHUB_ENV"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify 16 KB native alignment
        run: |
          set -euo pipefail
          APK="$(ls app/build/outputs/apk/release/app-release*.apk | head -1)"
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT
          unzip -Z1 "$APK" | grep -E '^lib/arm64-v8a/libampy_.*\.so$' > "$TMP_DIR/libs.txt"
          test "$(wc -l < "$TMP_DIR/libs.txt")" -eq 3
          while IFS= read -r entry; do
            so_file="$TMP_DIR/$(basename "$entry")"
            unzip -p "$APK" "$entry" > "$so_file"
            echo "Checking $entry"
            readelf -lW "$so_file" | awk '$1 == "LOAD" { print $NF }' | while IFS= read -r align; do
              value=$((16#${align#0x}))
              if [ "$value" -lt 16384 ]; then
                echo "ERROR: $entry has a LOAD segment aligned to $align"
                exit 1
              fi
            done
          done < "$TMP_DIR/libs.txt"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -1)"
          "$ZIPALIGN" -c -P 16 4 "$APK"

      - name: Name release APK by version
        id: apk
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          APK_DIR="app/build/outputs/apk/release"
          if [ -f "$APK_DIR/app-release.apk" ]; then
            NAME="Ampy-v${VERSION}.apk"
            mv "$APK_DIR/app-release.apk" "$APK_DIR/$NAME"
          else
            NAME="Ampy-v${VERSION}-unsigned.apk"
            mv "$APK_DIR/app-release-unsigned.apk" "$APK_DIR/$NAME"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "APK renamed to $NAME"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ampy-release
          path: app/build/outputs/apk/release/Ampy-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Verify the APK signature
        if: env.HAS_SIGNING == 'true'
        env:
          APK_NAME: ${{ steps.apk.outputs.name }}
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "app/build/outputs/apk/release/$APK_NAME"

      - name: Publish signed GitHub Release (on v* tags)
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_SIGNING == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/release/${{ steps.apk.outputs.name }}
          generate_release_notes: true
